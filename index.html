<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Meu Treino">
<meta name="theme-color" content="#f7f2ec">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Meu Treino</title>
<style>
:root{ --bg:#f7f2ec; --card:#ffffff; --ink:#2a2226; --muted:#7a6e72;
  --accent:#c2456e; --ok:#2f8a5b; --shadow:0 2px 10px rgba(60,30,40,.08); }
@media (prefers-color-scheme: dark){
  :root{ --bg:#1b1719; --card:#262023; --ink:#f3ecef; --muted:#b0a3a8;
    --accent:#e2648d; --ok:#5cc28c; --shadow:none; }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font:18px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;
  padding:env(safe-area-inset-top) 16px calc(env(safe-area-inset-bottom) + 24px);
  max-width:640px;margin:0 auto;-webkit-user-select:none;user-select:none}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer}
h1{font-size:30px;margin:0}
h2{font-size:26px;margin:4px 0}
h3.sec{font-size:15px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:28px 4px 10px}
.top{display:flex;align-items:center;justify-content:space-between;padding:16px 0 8px;gap:8px}
.voltar{font-size:17px;padding:10px 12px 10px 0;color:var(--accent);font-weight:600}
.card{background:var(--card);border-radius:20px;box-shadow:var(--shadow);padding:18px}
.hoje{border-top:6px solid var(--c)}
.hoje small{color:var(--muted);font-size:15px;text-transform:uppercase;letter-spacing:.06em}
.hoje p{color:var(--muted);margin:4px 0 16px}
.big{display:block;width:100%;background:var(--accent);color:#fff;font-size:21px;font-weight:700;
  padding:18px;border-radius:16px;text-align:center}
.big.ok{background:var(--ok)}
.item{display:flex;align-items:center;gap:14px;padding:14px;border-radius:16px;background:var(--card);
  box-shadow:var(--shadow);margin-bottom:10px;width:100%;text-align:left}
.letra{width:46px;height:46px;border-radius:14px;background:var(--c);color:#fff;display:grid;place-items:center;
  font-weight:800;font-size:22px;flex:none}
.item .t{flex:1;min-width:0}
.item .t b{display:block}
.item .t span{color:var(--muted);font-size:15px}
.badge{background:var(--accent);color:#fff;font-size:13px;font-weight:700;padding:4px 10px;border-radius:99px}
.ex{margin-bottom:16px;padding:12px}
.ex h3{font-size:21px;margin:12px 4px 2px}
.fotos{display:grid;grid-template-columns:1fr 1fr;gap:6px;width:100%;padding:0}
.fotos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:var(--bg);display:block}
.viewer{position:fixed;inset:0;background:rgba(20,10,15,.92);color:#fff;display:flex;flex-direction:column;
  align-items:center;gap:14px;z-index:10;padding:calc(env(safe-area-inset-top) + 24px) 16px 24px;overflow:auto}
.viewer[hidden]{display:none}
.viewer h3{margin:0;font-size:22px;text-align:center}
.viewer img{max-width:100%;max-height:40vh;border-radius:14px}
.viewer button{background:rgba(255,255,255,.16);color:#fff;padding:14px 28px;border-radius:14px;font-size:19px;font-weight:600}
.toast{position:fixed;left:16px;right:16px;bottom:calc(env(safe-area-inset-bottom) + 20px);background:var(--ok);color:#fff;
  padding:16px;border-radius:16px;text-align:center;font-weight:700;font-size:18px;z-index:20}
.credito{color:var(--muted);font-size:13px;text-align:center;margin-top:28px}
</style>
</head>
<body>
<div id="app"></div>

<div class="viewer" id="viewer" hidden>
  <h3 id="vtit"></h3>
  <img id="vimg0" alt="">
  <img id="vimg1" alt="">
  <button id="vfechar">Fechar</button>
</div>

<script>
// ====== OS TREINOS (nome de cada exercício, na ordem da ficha) ======
const TREINOS = [
  { id:'A', nome:'Glúteo', cor:'#c2456e', ex:[
    'Hack squat invertido', 'Elevação pélvica', 'Glúteo na polia baixa',
    'Abdução de quadril em pé (máquina)', 'Agachamento búlgaro' ]},
  { id:'B', nome:'Peito, ombro e tríceps', cor:'#d9822b', ex:[
    'Supino reto barra (ou halteres)', 'Supino articulado', 'Crucifixo na máquina',
    'Desenvolvimento com halter sentado', 'Elevação lateral com halter', 'Tríceps pulley corda', 'Abdominal rodinha' ]},
  { id:'C', nome:'Costas e bíceps', cor:'#3b7dc4', ex:[
    'Puxada frontal', 'Remada curvada com barra', 'Remada articulada unilateral neutra',
    'Crucifixo inverso no aparelho', 'Face pull', 'Bíceps no aparelho Scott', 'Bíceps corda' ]},
  { id:'D', nome:'Pernas', cor:'#2f8a5b', ex:[
    'Agachamento no Smith', 'Levantamento terra barra', 'Leg press 45°',
    'Agachamento sumô com halter', 'Cadeira extensora', 'Afundo com halter' ]},
];
// Fotos: img/A0-0.jpg = Treino A, 1º exercício, começo do movimento; -1 = fim (free-exercise-db, domínio público)
const foto = (key, n) => `img/${key}-${n}.jpg`;

// ====== DADOS SALVOS NO CELULAR ======
const KEY = 'meu-treino-v1';
let st = { proximo:0, historico:[] };
try { Object.assign(st, JSON.parse(localStorage.getItem(KEY)) || {}); } catch(e){}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(st)); } catch(e){} };
if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(()=>{});

// ====== UTILIDADES ======
const $ = s => document.querySelector(s);
const app = $('#app');
const dataBR = iso => new Date(iso).toLocaleDateString('pt-BR', { weekday:'short', day:'2-digit', month:'2-digit' });
const ultimo = id => { for (let i = st.historico.length - 1; i >= 0; i--) if (st.historico[i].t === id) return st.historico[i].data; return null; };
function toast(msg){
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = msg;
  document.body.appendChild(t); setTimeout(() => t.remove(), 2600);
}

// ====== TELAS ======
let aberto = null;   // null = tela inicial; número = treino aberto
function go(i){ aberto = i; render(); window.scrollTo(0, 0); }
function render(){ aberto === null ? renderHome() : renderTreino(aberto); }

function renderHome(){
  const i = st.proximo, t = TREINOS[i], u = ultimo(t.id);
  app.innerHTML = `
    <div class="top"><h1>Meu Treino</h1></div>
    <div class="card hoje" style="--c:${t.cor}">
      <small>Treino de hoje</small>
      <div style="display:flex;align-items:center;gap:14px;margin-top:10px">
        <div class="letra" style="--c:${t.cor}">${t.id}</div><h2>${t.nome}</h2>
      </div>
      <p>${t.ex.length} exercícios${u ? ' · última vez ' + dataBR(u) : ''}</p>
      <button class="big" data-a="abrir" data-i="${i}">Começar treino</button>
    </div>
    <h3 class="sec">Ordem dos treinos</h3>
    ${TREINOS.map((x, j) => {
      const ux = ultimo(x.id);
      return `<button class="item" data-a="abrir" data-i="${j}">
        <div class="letra" style="--c:${x.cor}">${x.id}</div>
        <div class="t"><b>${x.nome}</b><span>${ux ? 'Última vez ' + dataBR(ux) : 'Ainda não feito'}</span></div>
        ${j === i ? '<span class="badge">Próximo</span>' : ''}
      </button>`; }).join('')}
    <p class="credito">Fotos: free-exercise-db (domínio público)</p>
  `;
}

function renderTreino(i){
  const t = TREINOS[i];
  app.innerHTML = `
    <div class="top"><button class="voltar" data-a="home">‹ Voltar</button></div>
    <div style="display:flex;align-items:center;gap:14px;margin-bottom:16px">
      <div class="letra" style="--c:${t.cor}">${t.id}</div><h2>${t.nome}</h2>
    </div>
    ${t.ex.map((nome, k) => `<div class="card ex">
      <button class="fotos" data-a="foto" data-k="${t.id + k}" data-n="${nome}">
        <img src="${foto(t.id + k, 0)}" alt="" loading="lazy"><img src="${foto(t.id + k, 1)}" alt="" loading="lazy">
      </button>
      <h3>${k + 1}. ${nome}</h3>
    </div>`).join('')}
    <button class="big ok" data-a="concluir" data-i="${i}" style="margin-top:8px">Concluir treino ✓</button>
  `;
}

// ====== AÇÕES ======
app.addEventListener('click', ev => {
  const b = ev.target.closest('[data-a]'); if (!b) return;
  const a = b.dataset.a;
  if (a === 'home') go(null);
  else if (a === 'abrir') go(+b.dataset.i);
  else if (a === 'concluir') {
    const t = TREINOS[+b.dataset.i];
    st.historico.push({ t:t.id, data:new Date().toISOString() });
    st.proximo = (+b.dataset.i + 1) % TREINOS.length; save();
    go(null);
    toast(`Treino ${t.id} concluído! 🎉 Próximo: Treino ${TREINOS[st.proximo].id}`);
  }
  else if (a === 'foto') {
    $('#vtit').textContent = b.dataset.n;
    $('#vimg0').src = foto(b.dataset.k, 0); $('#vimg1').src = foto(b.dataset.k, 1);
    $('#viewer').hidden = false;
  }
});
$('#vfechar').onclick = () => $('#viewer').hidden = true;

// ====== INICIAR ======
render();
if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(()=>{});
</script>
</body>
</html>
